version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nids_postgres
    environment:
      POSTGRES_USER: nids_user
      POSTGRES_PASSWORD: nids_password
      POSTGRES_DB: nids_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nids_user -d nids_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nids_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nids_user:nids_password@postgres:5432/nids_db
      - SECRET_KEY=super-secret-jwt-key-change-in-production-12345
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nids_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
